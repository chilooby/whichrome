<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="The Whichrome picker: four browser options labelled with nickname, account and computer, one recommended, one on another computer, one unavailable">
  <defs>
    <style>
      .bg    { fill: #141C26; }
      .card  { fill: #1B2531; }
      .row   { fill: #202B39; }
      .rowsel{ fill: #1E3A3A; }
      .ink   { fill: #F2F5F7; font-family: "Segoe UI", Inter, system-ui, sans-serif; }
      .dim   { fill: #8C9AAA; font-family: "Segoe UI", Inter, system-ui, sans-serif; }
      .faint { fill: #5F6C7B; font-family: "Segoe UI", Inter, system-ui, sans-serif; }
      .teal  { fill: #20D9BB; font-family: "Segoe UI", Inter, system-ui, sans-serif; }
      .mono  { font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace; }
      .t18   { font-size: 18px; font-weight: 600; }
      .t15   { font-size: 15px; font-weight: 600; }
      .t13   { font-size: 13px; }
      .t12   { font-size: 12px; }
      .t11   { font-size: 11px; letter-spacing: .09em; }
    </style>
  </defs>

  <rect width="900" height="560" rx="18" class="bg"/>

  <!-- header -->
  <circle cx="46" cy="46" r="9" fill="#FFFFFF"/>
  <circle cx="74" cy="46" r="9" fill="#FFFFFF"/>
  <circle cx="74" cy="46" r="15" fill="none" stroke="#20D9BB" stroke-width="4"/>
  <circle cx="102" cy="46" r="9" fill="#FFFFFF"/>
  <text x="128" y="52" class="ink t18">Which Chrome should I use?</text>
  <text x="128" y="74" class="faint t12">this computer: Desk PC &#183; 4 connected &#183; 1 elsewhere &#183; 1 unavailable</text>

  <!-- option 1: recommended -->
  <rect x="32" y="102" width="836" height="88" rx="12" class="rowsel" stroke="#20D9BB" stroke-width="2"/>
  <circle cx="62" cy="146" r="8" fill="#20D9BB"/>
  <text x="88" y="136" class="ink t15">cyborg &#8212; you@example.com</text>
  <rect x="356" y="122" width="118" height="20" rx="10" fill="#20D9BB"/>
  <text x="371" y="136" class="t11" style="fill:#0C1B1B;font-weight:700">RECOMMENDED</text>
  <text x="88" y="160" class="dim t13 mono">1ec7d06e</text>
  <text x="176" y="160" class="dim t13">on Desk PC &#183; proved to be on this computer &#183; verified today</text>

  <!-- option 2 -->
  <rect x="32" y="202" width="836" height="78" rx="12" class="row"/>
  <circle cx="62" cy="241" r="8" fill="none" stroke="#5F6C7B" stroke-width="2"/>
  <text x="88" y="234" class="ink t15">cyborg-2 &#8212; you@example.com</text>
  <text x="88" y="258" class="dim t13 mono">ba237d7c</text>
  <text x="176" y="258" class="dim t13">same profile, second connection &#183; not the window holding your session</text>

  <!-- option 3: elsewhere -->
  <rect x="32" y="292" width="836" height="78" rx="12" class="row"/>
  <circle cx="62" cy="331" r="8" fill="none" stroke="#5F6C7B" stroke-width="2"/>
  <text x="88" y="324" class="dim t15">work &#8212; work@example.com</text>
  <rect x="330" y="310" width="196" height="20" rx="10" fill="#3A2F1C"/>
  <text x="345" y="324" class="t11" style="fill:#E0A64A;font-weight:700">ON ANOTHER COMPUTER</text>
  <text x="88" y="348" class="faint t13 mono">9653c8f9</text>
  <text x="176" y="348" class="faint t13">connected, but it runs on Work laptop &#8212; you would not see the window</text>

  <!-- option 4: unavailable -->
  <rect x="32" y="382" width="836" height="78" rx="12" class="row" opacity=".55"/>
  <circle cx="62" cy="421" r="8" fill="none" stroke="#4A5563" stroke-width="2"/>
  <text x="88" y="414" class="faint t15">personal &#8212; you@personal.example</text>
  <rect x="392" y="400" width="118" height="20" rx="10" fill="#2A313B"/>
  <text x="407" y="414" class="t11" style="fill:#8C9AAA;font-weight:700">UNAVAILABLE</text>
  <text x="88" y="438" class="faint t13 mono">09b0a7ec</text>
  <text x="176" y="438" class="faint t13">not connected to the extension right now</text>

  <!-- footer -->
  <text x="32" y="498" class="faint t12">Generated by</text>
  <text x="108" y="498" class="teal t12 mono">whichrome picker --connected connected.json --want cyborg</text>
  <text x="32" y="524" class="faint t12">Every browser is listed. Nothing is hidden; unavailable ones say why.</text>
</svg>
