<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" role="img" aria-label="A field-guide identification plate listing four connected Chrome browsers: two on this computer annotated as one profile connected twice, one running on another computer, one not connected">
  <defs>
    <style>
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif; }
      .mono  { font-family: "Courier New", "Nimbus Mono", Courier, monospace; }
      .ink    { fill: #1F1A14; }
      .ink2   { fill: #4A4137; }
      .ink3   { fill: #7C7163; }
      .red    { fill: #C0392B; }
      .plate  { font-size: 11px; letter-spacing: .26em; font-weight: 700; }
      .sp     { font-size: 19px; font-style: italic; }
      .acct   { font-size: 13.5px; }
      .note   { font-size: 12.5px; }
      .id     { font-size: 12px; letter-spacing: .04em; }
      .annot  { font-size: 11.5px; font-style: italic; }
      .num    { font-size: 13px; letter-spacing: .1em; }
    </style>
    <!-- engraved hatching for the specimen roundels -->
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#1F1A14" stroke-width="1.5" opacity=".55"/>
    </pattern>
    <pattern id="hatchLight" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1F1A14" stroke-width="1" opacity=".28"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- paper -->
  <rect width="980" height="660" fill="#EDE6D6"/>
  <rect width="980" height="660" fill="#EDE6D6" filter="url(#grain)" opacity=".9"/>
  <rect x="28" y="24" width="924" height="612" fill="none" stroke="#1F1A14" stroke-width="1" opacity=".45"/>
  <rect x="34" y="30" width="912" height="600" fill="none" stroke="#1F1A14" stroke-width="2.5" opacity=".75"/>

  <!-- plate heading -->
  <text x="60" y="72" class="serif ink plate">PLATE I &#183; CONNECTED BROWSERS</text>
  <text x="920" y="72" class="serif ink3 plate" text-anchor="end">DESK PC</text>
  <line x1="60" y1="86" x2="920" y2="86" stroke="#1F1A14" stroke-width="1.5" opacity=".7"/>
  <text x="60" y="112" class="serif ink2" font-size="14.5" font-style="italic">Four connected; two share one profile. Identification marks below.</text>

  <!-- ══ I. the specimen to take ══ -->
  <g transform="translate(0,0)">
    <!-- roundel -->
    <circle cx="108" cy="184" r="34" fill="url(#hatch)"/>
    <circle cx="108" cy="184" r="34" fill="none" stroke="#1F1A14" stroke-width="2"/>
    <rect x="88" y="170" width="40" height="28" fill="#EDE6D6" stroke="#1F1A14" stroke-width="1.5"/>
    <line x1="88" y1="178" x2="128" y2="178" stroke="#1F1A14" stroke-width="1.5"/>
    <circle cx="93" cy="174" r="1.6" fill="#1F1A14"/><circle cx="99" cy="174" r="1.6" fill="#1F1A14"/><circle cx="105" cy="174" r="1.6" fill="#1F1A14"/>
    <!-- hand-inked identification ring -->
    <ellipse cx="108" cy="184" rx="47" ry="45" fill="none" stroke="#C0392B" stroke-width="3" opacity=".92"/>
    <ellipse cx="108" cy="184" rx="50" ry="48.5" fill="none" stroke="#C0392B" stroke-width="1" opacity=".45"/>

    <text x="176" y="166" class="serif ink3 num">I.</text>
    <text x="204" y="168" class="serif ink sp">cyborg</text>
    <text x="204" y="192" class="serif ink2 acct">you@example.com &#183; Chrome, Profile 1</text>
    <text x="204" y="214" class="mono ink3 id">1ec7d06e</text>
    <text x="300" y="214" class="serif ink3 note">beacon-proved here &#183; holds the live session &#183; verified today</text>

    <text x="920" y="176" class="serif red annot" text-anchor="end">&#8592; take this one</text>
    <text x="920" y="198" class="serif ink3 plate" text-anchor="end" font-size="10">THIS COMPUTER</text>
  </g>
  <line x1="176" y1="238" x2="920" y2="238" stroke="#1F1A14" stroke-width=".75" opacity=".3"/>

  <!-- ══ II. the lookalike ══ -->
  <g transform="translate(0,124)">
    <circle cx="108" cy="184" r="34" fill="url(#hatch)"/>
    <circle cx="108" cy="184" r="34" fill="none" stroke="#1F1A14" stroke-width="2"/>
    <rect x="88" y="170" width="40" height="28" fill="#EDE6D6" stroke="#1F1A14" stroke-width="1.5"/>
    <line x1="88" y1="178" x2="128" y2="178" stroke="#1F1A14" stroke-width="1.5"/>
    <circle cx="93" cy="174" r="1.6" fill="#1F1A14"/><circle cx="99" cy="174" r="1.6" fill="#1F1A14"/><circle cx="105" cy="174" r="1.6" fill="#1F1A14"/>

    <text x="176" y="166" class="serif ink3 num">II.</text>
    <text x="204" y="168" class="serif ink sp">cyborg-2</text>
    <text x="204" y="192" class="serif ink2 acct">you@example.com &#183; Chrome, Profile 1</text>
    <text x="204" y="214" class="mono ink3 id">ba237d7c</text>
    <text x="300" y="214" class="serif ink3 note">second connection of the same profile &#183; not the window you are watching</text>
    <text x="920" y="198" class="serif ink3 plate" text-anchor="end" font-size="10">THIS COMPUTER</text>
  </g>

  <!-- the annotation no device picker makes: II is the same profile as I.
       "cf." is how a field guide points you at the specimen to compare against. -->
  <text x="204" y="356" class="serif red annot">cf. I &#8212; the same profile, connected a second time</text>

  <line x1="176" y1="376" x2="920" y2="376" stroke="#1F1A14" stroke-width=".75" opacity=".3"/>

  <!-- ══ III. elsewhere ══ -->
  <g transform="translate(0,248)" opacity=".92">
    <circle cx="108" cy="184" r="34" fill="url(#hatchLight)"/>
    <circle cx="108" cy="184" r="34" fill="none" stroke="#1F1A14" stroke-width="1.6" opacity=".7"/>
    <rect x="88" y="170" width="40" height="28" fill="#EDE6D6" stroke="#1F1A14" stroke-width="1.2" opacity=".7"/>
    <line x1="88" y1="178" x2="128" y2="178" stroke="#1F1A14" stroke-width="1.2" opacity=".7"/>
    <circle cx="93" cy="174" r="1.5" fill="#1F1A14" opacity=".7"/><circle cx="99" cy="174" r="1.5" fill="#1F1A14" opacity=".7"/><circle cx="105" cy="174" r="1.5" fill="#1F1A14" opacity=".7"/>

    <text x="176" y="166" class="serif ink3 num">III.</text>
    <text x="204" y="168" class="serif ink2 sp">work</text>
    <text x="204" y="192" class="serif ink2 acct">work@example.com</text>
    <text x="204" y="214" class="mono ink3 id">9653c8f9</text>
    <text x="300" y="214" class="serif ink3 note">connected, but the window stands on another desk</text>
    <text x="920" y="176" class="serif red annot" text-anchor="end">you would not see it</text>
    <text x="920" y="198" class="serif ink3 plate" text-anchor="end" font-size="10">WORK LAPTOP</text>
  </g>
  <line x1="176" y1="486" x2="920" y2="486" stroke="#1F1A14" stroke-width=".75" opacity=".3"/>

  <!-- ══ IV. absent ══ -->
  <g transform="translate(0,372)" opacity=".5">
    <circle cx="108" cy="184" r="34" fill="none" stroke="#1F1A14" stroke-width="1.4" stroke-dasharray="4 5" opacity=".8"/>
    <rect x="88" y="170" width="40" height="28" fill="none" stroke="#1F1A14" stroke-width="1.1" stroke-dasharray="3 4" opacity=".8"/>

    <text x="176" y="166" class="serif ink3 num">IV.</text>
    <text x="204" y="168" class="serif ink2 sp">personal</text>
    <text x="204" y="192" class="serif ink3 acct">you@personal.example</text>
    <text x="204" y="214" class="mono ink3 id">09b0a7ec</text>
    <text x="300" y="214" class="serif ink3 note">recorded in the registry, absent from this session</text>
    <text x="920" y="198" class="serif ink3 plate" text-anchor="end" font-size="10">NOT CONNECTED</text>
  </g>

  <!-- colophon -->
  <line x1="60" y1="600" x2="920" y2="600" stroke="#1F1A14" stroke-width="1.5" opacity=".7"/>
  <text x="60" y="620" class="mono ink2" font-size="11.5">whichrome picker --connected connected.json --want cyborg</text>
  <text x="920" y="620" class="serif ink3 annot" text-anchor="end">every browser listed &#183; absent ones say why</text>
</svg>
